# 路径统一在这里管理；相对路径以仓库根目录为基准。
# 每台机器的设置建议写进 paths.local.yml，只写要覆盖的项即可。
# Windows 路径建议用单引号和正斜杠，例如 'D:/datasets/BIT_training_dataset'。
paths:
  # 模型与数据设置文件
  data_config: 'configs/multi_modality_512.py'
  model_config: 'configs/dgim_ds.py'

  # 训练数据（单独上传，不放入 GitHub）；下一层应为 scene01 等场景目录
  train_data_root: '../BIT_training_dataset/BIT_multi-modal_datasets_homography_30_rotation'

  # 风格生成器：图片和权重已随仓库提供
  style_dir: 'src/fast_neural_style/styles'
  style_checkpoint: 'src/fast_neural_style/weights/epoch5.pth'

  # v4 新模型须自己训练；原版 dgim_512.ckpt 仍可通过 demo --checkpoint 指定。
  matcher_checkpoint: 'outputs/checkpoints/repvit_dino/finetune/last.ckpt'
  # 默认预训练从随机参数开始；微调由这里载入上一阶段的匹配器。
  pretrained_checkpoint: 'outputs/checkpoints/repvit_dino/pretrain/last.ckpt'
  resume_checkpoint: null      # 可选：恢复训练状态；与上一项按需择一使用

  # 保留的上游参考资源；v4 定制学生随机初始化，不加载分类权重。
  repvit_source_dir: 'third_party/repvit'
  repvit_checkpoint: null

  # DINOv3 ConvNeXt-Large：权重单独上传，代码随仓库提供，无隐式下载。
  teacher_source_dir: 'third_party/dinov3'
  teacher_checkpoint: 'weights/dinov3_convnext_large_pretrain_lvd1689m-61fa432d.pth'
  teacher_cache_dir: 'outputs/teacher_cache'

  # 输出目录：在实际运行时创建
  log_dir: 'outputs/training'
  checkpoint_dir: 'outputs/checkpoints'
  sample_dir: 'sample'         # demo 输入目录 / GUI 选图初始目录
  demo_output_dir: 'outputs/matches'

  # 以下为原配置兼容字段，当前 BIT 训练和 demo 不使用，保持 null 即可
  train_pose_root: null
  train_npz_root: null
  train_list_path: null
  train_intrinsic_path: null
  val_data_root: null
  val_pose_root: null
  val_npz_root: null
  val_list_path: null
  val_intrinsic_path: null
  test_data_root: null
  test_pose_root: null
  test_npz_root: null
  test_list_path: null
  test_intrinsic_path: null
